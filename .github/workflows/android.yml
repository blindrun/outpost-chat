name: Android client

# Same tag trigger as desktop.yml -- a real signed release build shouldn't
# happen on every branch push, only when a version is actually being cut.
# Also manually triggerable (workflow_dispatch) so this new workflow can be
# test-run in isolation without cutting a real tagged release, which would
# also fire desktop.yml and docker.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "versionName to stamp, without the leading v (e.g. 0.6.2). Leave blank for a plain dev build."
        required: false
        default: ""
      publish:
        description: "Upload the AAB to the Play alpha track. Off by default, because a manual run is normally just a build check and this goes to real testers."
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` isn't a resolvable named-value inside a step's own `if:` --
    # GitHub's workflow parser rejects it at validation time, not just at
    # runtime. Job-level env is, so route it through here instead.
    env:
      HAS_PLAY_CREDENTIALS: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON != '' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor's CLI specifically requires Node >=22 (fails fast with
          # "[fatal] The Capacitor CLI requires NodeJS >=22.0.0" otherwise) --
          # unlike desktop.yml/docker.yml, which are both fine on Node 20.
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8's own Android module compiles against Java 21 --
          # 17 failed with "Java compilation initialization error: invalid
          # source release: 21" on capacitor-android specifically.
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install web client deps
        working-directory: web
        run: npm ci

      - name: Install mobile (Capacitor) deps
        working-directory: mobile
        run: npm ci

      - name: Build web client + sync into the native Android project
        working-directory: mobile
        run: npm run sync

      # versionCode was a static value hand-bumped in build.gradle -- exactly
      # the same class of bug as iOS's CURRENT_PROJECT_VERSION (see ios.yml):
      # it wasn't bumped between the 0.2.21 closed-testing upload and v0.3.5,
      # so the v0.3.5 AAB was silently unusable for Play Console (rejected,
      # "Version code 3 has already been used") even though it built and
      # attached to the GitHub Release fine. Play Store requires every
      # uploaded build to have a strictly higher versionCode than the last,
      # forever, regardless of versionName -- github.run_number is
      # monotonically increasing across every workflow run, removing this
      # failure mode for good instead of relying on remembering to bump it.
      # Anchored to the real declaration. The previous pattern was
      # `versionCode [0-9]*`, and `*` matches ZERO digits, so it also rewrote
      # the word "versionCode" inside the comment above the declaration --
      # CI logs showed `// versionCode 39is Play Store's own monotonic...`.
      # Harmless in a comment, actively misleading in a log.
      - name: Set version code from the run number
        working-directory: mobile/android/app
        run: sed -i -E "s/^([[:space:]]*)versionCode [0-9]+/\1versionCode $GITHUB_RUN_NUMBER/" build.gradle

      # versionName had the same problem versionCode did, and it went
      # unnoticed for longer because nothing rejects it. build.gradle carried a
      # hardcoded "0.3.6" with a comment claiming it was kept in step with the
      # release -- it was not, and had not moved since 2026-08-07, so every
      # Android build from v0.3.7 to v0.6.2 reported itself as 0.3.6 while
      # containing much newer code. Play showed the v0.6.2 upload as
      # "38 (0.3.6)". Same shape as electron/package.json silently freezing,
      # which broke desktop auto-update for eleven releases.
      #
      # Deriving it from the tag means it cannot drift. Non-tag runs keep
      # whatever build.gradle says, which is correct for a local or dispatch
      # build that has no release identity.
      # The dispatch input exists because a workflow_dispatch run uses the
      # workflow file *at the selected ref*, so re-running an old tag would
      # use the old file and reintroduce the bug this step fixes. Dispatching
      # from main with a version instead rebuilds any release correctly.
      - name: Set version name from the tag
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
        working-directory: mobile/android/app
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" build.gradle
          grep -n 'versionCode\|versionName' build.gradle

      # No signing secrets configured yet (see mobile/android/keystore.properties.example
      # and the Play Console prerequisites in the mobile client plan) -- this
      # step is deliberately a no-op rather than a failure until then.
      # Without it, gradlew below produces an unsigned
      # AAB (fine for a GitHub Release attachment, not uploadable to Play
      # Console until this is wired up for real).
      - name: Write signing keystore
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured yet -- building unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > keystore.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build release AAB
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew bundleRelease

      # An AAB can't actually be sideloaded -- it's not an installable
      # package, Play Console (or bundletool) has to turn it into device-
      # specific APKs first. There's no signing keystore configured yet (see
      # the "Write signing keystore" no-op above), so a real Play-signed
      # release APK isn't buildable either -- the debug APK (self-signed with
      # the Android debug key) is the only installable artifact available
      # right now, for tagged releases and manual test runs alike.
      - name: Build debug APK
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload build as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: outpost-android-test-build
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      # Manual dispatch runs never touch a GitHub Release, so the signed AAB
      # (needed for the Play Console manual-first-upload step) would
      # otherwise only ever exist transiently on the runner. Only meaningful
      # when the signing keystore secrets are actually set -- otherwise this
      # is the same unsigned bundle the "Write signing keystore" no-op above
      # already warns about.
      - name: Upload signed AAB as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') && env.HAS_KEYSTORE == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: outpost-android-release-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/extract-changelog.sh "${{ github.ref_name }}" > release-notes.md

      # The debug APK is the real, actually-installable download for users --
      # attached alongside the AAB (kept around for the eventual Play Console
      # submission once signing is set up, not useful to a user directly).
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            mobile/android/app/build/outputs/bundle/release/app-release.aab
            mobile/android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false

      # Inert until the one-time manual Play Console bootstrap is done (an
      # app must already exist there before the API can publish to it --
      # see the mobile client plan) and a service account key is added as
      # ANDROID_PLAY_SERVICE_ACCOUNT_JSON. Safe to sit merged and unused
      # until then, same as the keystore step above.
      # Track is `alpha`, which is the API name for the "Closed testing -
      # Alpha" track. It was `internal` and that was wrong in a way nothing
      # would have reported: the internal track is Inactive with no release
      # and no testers, so a successful publish would have shipped to nobody
      # while reporting green. Every real tester is on the closed track.
      #
      # ANDROID_PLAY_SERVICE_ACCOUNT_JSON exists as of 2026-08-15, and its
      # service account is invited in Play Console with "Release apps to
      # testing tracks" on Outpost. So this step now actually runs on a tag.
      #
      # A tag push is the normal path. `workflow_dispatch` skipped this
      # unconditionally on the ref check alone, which meant a manual run could
      # never exercise the publish path at all -- it reported green having
      # proven only that the build compiles. The `publish` input makes it
      # testable on demand while keeping the default a build check, because
      # every publish reaches real testers and re-enters review.
      # Play release notes were never wired up, so every Play release from the
      # first one onward shipped with none and testers saw an update with no
      # indication of what changed. `release-notes.md` above looks like it
      # covers this and does not -- it only ever fed the GitHub release, and
      # Play needs a different shape anyway (500-char cap, plain text, one
      # file per locale in a directory).
      - name: Build Play release notes
        if: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && env.HAS_PLAY_CREDENTIALS == 'true' }}
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-${GITHUB_REF_NAME#v}}"
          # A dispatch run with a blank version resolves to the branch name,
          # which has no changelog section. Refuse rather than publish an
          # unlabelled build to real testers.
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "refusing to publish without a real version (got '$VERSION'); pass -f version=X.Y.Z" >&2; exit 1 ;;
          esac
          bash .github/scripts/play-whatsnew.sh "$VERSION" distribution/whatsnew
          echo "--- what testers will see ---"
          cat distribution/whatsnew/whatsnew-en-US

      - name: Publish to Play Console
        if: ${{ (startsWith(github.ref, 'refs/tags/') || inputs.publish) && env.HAS_PLAY_CREDENTIALS == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.outpostchat.mobile
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: alpha
          whatsNewDirectory: distribution/whatsnew
