name: Android client

# Same tag trigger as desktop.yml -- a real signed release build shouldn't
# happen on every branch push, only when a version is actually being cut.
# Also manually triggerable (workflow_dispatch) so this new workflow can be
# test-run in isolation without cutting a real tagged release, which would
# also fire desktop.yml and docker.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # `secrets` isn't a resolvable named-value inside a step's own `if:` --
    # GitHub's workflow parser rejects it at validation time, not just at
    # runtime. Job-level env is, so route it through here instead.
    env:
      HAS_PLAY_CREDENTIALS: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor's CLI specifically requires Node >=22 (fails fast with
          # "[fatal] The Capacitor CLI requires NodeJS >=22.0.0" otherwise) --
          # unlike desktop.yml/docker.yml, which are both fine on Node 20.
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 8's own Android module compiles against Java 21 --
          # 17 failed with "Java compilation initialization error: invalid
          # source release: 21" on capacitor-android specifically.
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install web client deps
        working-directory: web
        run: npm ci

      - name: Install mobile (Capacitor) deps
        working-directory: mobile
        run: npm ci

      - name: Build web client + sync into the native Android project
        working-directory: mobile
        run: npm run sync

      # No signing secrets configured yet (see mobile/android/keystore.properties.example
      # and the Play Console prerequisites in the mobile client plan) -- this
      # step is deliberately a no-op rather than a failure until then, same
      # pattern desktop.yml's Twitter announce step already uses for secrets
      # that don't exist yet. Without it, gradlew below produces an unsigned
      # AAB (fine for a GitHub Release attachment, not uploadable to Play
      # Console until this is wired up for real).
      - name: Write signing keystore
        working-directory: mobile/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "No signing keystore configured yet -- building unsigned."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > upload-keystore.jks
          cat > keystore.properties <<PROPS
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          PROPS

      - name: Build release AAB
        working-directory: mobile/android
        run: chmod +x gradlew && ./gradlew bundleRelease

      # An AAB can't actually be sideloaded -- it's not an installable
      # package, Play Console (or bundletool) has to turn it into device-
      # specific APKs first. For a manual (workflow_dispatch) test run there's
      # no tag to attach a Play-bound AAB to anyway, so build a debug APK
      # instead: self-signed with the Android debug key, directly
      # `adb install`-able / sideloadable on a real device.
      - name: Build debug APK (manual test runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - name: Upload build as a workflow artifact (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: outpost-android-test-build
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Extract this version's changelog section
        if: startsWith(github.ref, 'refs/tags/')
        run: bash .github/scripts/extract-changelog.sh "${{ github.ref_name }}" > release-notes.md

      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: mobile/android/app/build/outputs/bundle/release/app-release.aab
          fail_on_unmatched_files: false

      # Inert until the one-time manual Play Console bootstrap is done (an
      # app must already exist there before the API can publish to it --
      # see the mobile client plan) and a service account key is added as
      # ANDROID_PLAY_SERVICE_ACCOUNT_JSON. Safe to sit merged and unused
      # until then, same as the keystore step above.
      - name: Publish to Play Console
        if: ${{ startsWith(github.ref, 'refs/tags/') && env.HAS_PLAY_CREDENTIALS == 'true' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.ANDROID_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.outpostchat.mobile
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          track: internal
