name: Desktop client

# Only real way to produce genuine Windows/macOS installers for this
# project — the dev workstation this repo is built on is Linux-only, and
# macOS builds in particular need real Apple hardware/toolchain.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install web client deps
        working-directory: web
        run: npm ci

      - name: Install Electron deps
        working-directory: electron
        run: npm ci

      - name: Build
        working-directory: electron
        run: npm run dist
        env:
          # No code-signing certs configured — installers are unsigned.
          # Windows SmartScreen / macOS Gatekeeper will warn on first run;
          # that's a real limitation of not paying for a signing cert, not
          # a build error. CSC_IDENTITY_AUTO_DISCOVERY=false stops
          # electron-builder from failing when it can't find one.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Extract this version's changelog section
        shell: bash
        # A relative path (not /tmp or ${{ runner.temp }}) so this works the
        # same across bash on Linux/macOS and Git Bash on Windows, where
        # runner.temp is a backslash Windows path bash can't redirect into.
        run: bash .github/scripts/extract-changelog.sh "${{ github.ref_name }}" > release-notes.md

      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            electron/release/*.dmg
            electron/release/*.exe
            electron/release/*.AppImage
            electron/release/*.deb
            electron/release/*.zip
            electron/release/latest*.yml
            electron/release/*.blockmap
          fail_on_unmatched_files: false

  announce:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install announce script deps
        working-directory: .github/scripts/announce-release
        run: npm install

      - name: Fetch release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
        # This workflow triggers on tag push, not a `release` event, so
        # there's no github.event.release.body to read -- the release
        # itself was only just created by the build job's upload step, so
        # fetch its notes back via the API instead. EOF-delimited output
        # handles multi-line release notes safely.
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" --json body -q .body
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Post release announcement to X
        working-directory: .github/scripts/announce-release
        run: node post.js
        env:
          # Unset until the paid X API write tier is set up -- post.js
          # no-ops (not a failure) while these are empty. Add as repo
          # secrets (Settings -> Secrets and variables -> Actions) once
          # the @useoutpost developer app exists.
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}
          RELEASE_NOTES: ${{ steps.notes.outputs.body }}
