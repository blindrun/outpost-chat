services:
  postgres:
    image: postgres:16-alpine
    container_name: discord-clone-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=discord_clone
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=discord_clone
    ports:
      - "5433:5432"
    volumes:
      - discord-clone-pgdata:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: discord-clone-livekit
    restart: unless-stopped
    network_mode: host
    command: --dev

  minio:
    image: minio/minio:latest
    container_name: discord-clone-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=discord_clone
      - MINIO_ROOT_PASSWORD=devpassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - discord-clone-minio:/data
    command: server /data --console-address ":9001"

volumes:
  discord-clone-pgdata:
  discord-clone-minio:
