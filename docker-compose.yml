services:
  postgres:
    image: postgres:16-alpine
    container_name: outpost-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=outpost_dev
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=outpost_dev
    ports:
      - "5433:5432"
    volumes:
      - outpost-pgdata:/var/lib/postgresql/data

  livekit:
    image: livekit/livekit-server:latest
    container_name: outpost-livekit
    restart: unless-stopped
    network_mode: host
    command: --dev

  minio:
    image: minio/minio:latest
    container_name: outpost-minio
    restart: unless-stopped
    environment:
      - MINIO_ROOT_USER=outpost_dev
      - MINIO_ROOT_PASSWORD=devpassword123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - outpost-minio:/data
    command: server /data --console-address ":9001"

volumes:
  outpost-pgdata:
  outpost-minio:
